# Infrastructure as code: prepares a fresh Ubuntu VM (staging or production) for the app.
- name: Provision ResilienceOps hosts
  hosts: all
  become: true
  tasks:
    - name: Install Java runtime, nginx and chaos tooling
      ansible.builtin.apt:
        name:
          - openjdk-17-jre-headless
          - python3
          - nginx
          - stress-ng
          - iptables
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create the application root
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: "{{ app_user }}"
        mode: "0755"

    - name: Install the downstream quote service
      ansible.builtin.copy:
        src: "{{ quote_service_local }}"
        dest: "{{ app_root }}/quote_service.py"
        owner: "{{ app_user }}"
        mode: "0755"
      notify: Restart quote service

    - name: Install the quote service unit
      ansible.builtin.template:
        src: quote-service.service.j2
        dest: /etc/systemd/system/resilienceops-quote.service
        mode: "0644"
      notify: Restart quote service

    - name: Start the quote service
      ansible.builtin.systemd:
        name: resilienceops-quote
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart quote service
      ansible.builtin.systemd:
        name: resilienceops-quote
        state: restarted
        daemon_reload: true
